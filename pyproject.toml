[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sift"
version = "1.0.0"
description = 'Server-side template injection detection engine with template-engine fingerprinting and SARIF output.'
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Konain Sultan Khan (KK)", email = "kkdev9715@gmail.com"}]
keywords = ["security", "ssti", "scanner", "sarif", "appsec"]

[project.urls]
Homepage = "https://github.com/kkcyber2/sift"
Repository = "https://github.com/kkcyber2/sift"

[project.optional-dependencies]
# jinja2 is a test-only dependency: the end-to-end test stands up a server that
# genuinely evaluates Jinja2, so the differential has something real to detect.
dev = ["pytest>=7", "jinja2>=3"]

[tool.setuptools]
packages = ["sift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
